name: Update Gold Price

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch gold price
        id: fetch
        shell: bash
        run: |
          set -e
          curl -sL https://call1.tgju.org/ajax.json -o tgju.json
          PRICE=$(python3 - <<'PY'
import json
with open("tgju.json", "r", encoding="utf-8") as f:
    data = json.load(f)
print(data["current"]["tgju_gold_irg18"]["p"].replace(",", ""))
PY
          )
          echo "PRICE=$PRICE" >> $GITHUB_ENV
          NOW=$(TZ="Asia/Tehran" date '+%Y/%m/%d - %H:%M')
          echo "NOW=$NOW" >> $GITHUB_ENV

      - name: Update price.json
        shell: bash
        run: |
          cat > price.json <<EOF
          {
            "price": "$PRICE",
            "unit": "تومان",
            "updated_at": "$NOW"
          }
          EOF
          cat price.json

      - name: Commit and push changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add price.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update gold price"
            git push
          fi
