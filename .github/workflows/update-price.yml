name: Update Gold Price

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch gold price and update price.json
        shell: bash
        run: |
          set -e

          echo "Fetching gold price..."
          DATA=$(curl -sL https://call1.tgju.org/ajax.json)

          PRICE=$(python3 - <<'PY'
import json, os, sys
data = json.loads(os.environ["DATA"])
p = data["current"]["tgju_gold_irg18"]["p"]
print(str(p).replace(",", ""))
PY
          )

          NOW=$(TZ="Asia/Tehran" date '+%Y/%m/%d - %H:%M')

          cat > price.json <<EOF
          {
            "price": "$PRICE",
            "unit": "تومان",
            "updated_at": "$NOW"
          }
          EOF

          echo "Updated price.json:"
          cat price.json
        env:
          DATA: ${{ steps.fetch.outputs.data }}

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add price.json
          git diff --cached --quiet || git commit -m "Update gold price"
          git push
