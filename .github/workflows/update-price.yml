name: Update Gold Price

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-price:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch price and update price.json
        shell: bash
        run: |
          set -euo pipefail

          curl --fail --silent --show-error --location \
            --retry 3 \
            --connect-timeout 20 \
            --max-time 60 \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
            "https://www.tgju.org/profile/geram18" \
            --output geram18.html

          python3 - <<'PY'
          import json
          import re
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          html = Path("geram18.html").read_text(encoding="utf-8", errors="ignore")

          def normalize_text(s: str) -> str:
              trans = str.maketrans({
                  "۰": "0", "۱": "1", "۲": "2", "۳": "3", "۴": "4",
                  "۵": "5", "۶": "6", "۷": "7", "۸": "8", "۹": "9",
                  "٠": "0", "١": "1", "٢": "2", "٣": "3", "٤": "4",
                  "٥": "5", "٦": "6", "٧": "7", "٨": "8", "٩": "9",
                  "ك": "ک", "ي": "ی",
              })
              s = s.translate(trans)
              s = re.sub(r"\s+", " ", s)
              return s

          text = normalize_text(html)

          patterns = [
              r"طلا\s*18.*?(\d{3}(?:,\d{3}){2})",
              r"طلای\s*18.*?(\d{3}(?:,\d{3}){2})",
              r"(\d{3}(?:,\d{3}){2}).*?طلا\s*18",
              r"(\d{3}(?:,\d{3}){2}).*?طلای\s*18",
              r"طلا\s*18[^0-9]{0,40}([0-9]{3}(?:,[0-9]{3}){2})",
              r"طلای\s*18[^0-9]{0,40}([0-9]{3}(?:,[0-9]{3}){2})",
              r"g?eram18.*?(\d{3}(?:,\d{3}){2})",
          ]

          match = None
          for pattern in patterns:
              m = re.search(pattern, text, re.IGNORECASE)
              if m:
                  match = m
                  break

          if not match:
              candidates = []
              for m in re.finditer(r"\b\d{3}(?:,\d{3}){2}\b", text):
                  value = int(m.group(0).replace(",", ""))
                  if 50_000_000 <= value <= 500_000_000:
                      candidates.append(value)

              if candidates:
                  price_rial = candidates[0]
              else:
                  print("Could not find a valid 18K gold price in TGJU HTML.")
                  raise SystemExit(1)
          else:
              price_rial = int(match.group(1).replace(",", ""))

          price_toman = price_rial // 10

          tehran_time = timezone(timedelta(hours=3, minutes=30))
          updated_at = datetime.now(tehran_time).strftime("%Y/%m/%d - %H:%M")

          price_data = {
              "price": str(price_toman),
              "unit": "تومان",
              "updated_at": updated_at
          }

          Path("price.json").write_text(
              json.dumps(price_data, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )

          print("Price in rial:", price_rial)
          print("Price in toman:", price_toman)
          print(json.dumps(price_data, ensure_ascii=False, indent=2))
          PY

          # حذف فایل موقت
          rm -f geram18.html

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add price.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update gold price [skip ci]" && git push)
