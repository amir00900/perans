name: Update Gold Price

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-price:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch markets and update price.json
        shell: bash
        run: |
          set -euo pipefail

          fetch_page() {
            local url="$1"
            local out="$2"
            curl --fail --silent --show-error --location \
              --retry 2 \
              --connect-timeout 15 \
              -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36" \
              "$url" --output "$out" || touch "$out"
          }

          echo "دریافت صفحات TGJU..."
          fetch_page "https://www.tgju.org/profile/geram18" "geram18.html"
          fetch_page "https://www.tgju.org/profile/ons" "ons.html"
          fetch_page "https://www.tgju.org/profile/price_dollar_rl" "dollar.html"
          fetch_page "https://www.tgju.org/profile/price_eur" "eur.html"
          fetch_page "https://www.tgju.org/profile/sekee" "sekke.html"

          python3 - <<'PY'
          import json
          import re
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          def extract_data(filename, is_ons=False):
              p = Path(filename)
              if not p.exists():
                  return None, None
              html = p.read_text(encoding="utf-8", errors="ignore")
              if not html.strip():
                  return None, None

              # استخراج نرخ
              price = None
              price_patterns = [
                  r'<span[^>]*data-col=["\']price["\'][^>]*>([^<]+)</span>',
                  r'<span[^>]*class=["\'][^"\']*value[^"\']*["\'][^>]*>([^<]+)</span>',
                  r'<td[^>]*class=["\'][^"\']*info-price[^"\']*["\'][^>]*>([^<]+)</td>',
                  r'data-price=["\']([0-9.]+)["\']',
                  r'class=["\'][^"\']*price[^"\']*["\'][^>]*>([0-9,.]+)<'
              ]
              for pat in price_patterns:
                  m = re.search(pat, html)
                  if m:
                      raw = m.group(1).replace(',', '').replace('٫', '.').strip()
                      try:
                          val = float(raw)
                          if val > 0:
                              price = val if is_ons else int(val)
                              break
                      except Exception:
                          pass

              # استخراج درصد تغییرات روزانه
              change = None
              change_patterns = [
                  r'<span[^>]*data-col=["\']change_percent["\'][^>]*>(.*?)</span>',
                  r'<td[^>]*data-col=["\']change_percent["\'][^>]*>(.*?)</td>',
                  r'<span[^>]*class=["\'][^"\']*(?:change-percent|rate-change|info-change)[^"\']*["\'][^>]*>(.*?)</span>',
                  r'class=["\'][^"\']*(?:change_percent|change-percent|rate-change)[^"\']*["\'][^>]*>([^<]+)<'
              ]
              for cpat in change_patterns:
                  cm = re.search(cpat, html, re.DOTALL | re.IGNORECASE)
                  if cm:
                      txt = cm.group(1).strip()
                      is_neg = any(w in txt.lower() for w in ["-", "low", "danger", "down", "drop", "red"])
                      nums = re.findall(r'(\d+(?:[.,]\d+)?)', txt.replace('٫', '.'))
                      if nums:
                          try:
                              v = float(nums[0].replace(',', '.'))
                              change = -v if is_neg else v
                              break
                          except Exception:
                              pass

              return price, change

          p_gold18, c_gold18 = extract_data("geram18.html")
          p_ons, c_ons = extract_data("ons.html", is_ons=True)
          p_usd, c_usd = extract_data("dollar.html")
          p_eur, c_eur = extract_data("eur.html")
          p_sekke, c_sekke = extract_data("sekke.html")

          old_data = {}
          try:
              old_data = json.loads(Path("price.json").read_text(encoding="utf-8"))
          except Exception:
              pass

          old_m = old_data.get("markets", {})
          old_c = old_data.get("changes", {})

          def to_toman(val, min_v, max_v, fallback):
              if not val:
                  return fallback
              toman = int(val // 10 if val > max_v else val)
              return toman if min_v <= toman <= (max_v * 10) else fallback

          final_gold18 = to_toman(p_gold18, 10000000, 100000000, old_m.get("gold18") or 23871100)
          final_usd = to_toman(p_usd, 30000, 300000, old_m.get("usd") or 234010)
          final_eur = to_toman(p_eur, 30000, 350000, old_m.get("eur") or 266750)
          final_sekke = to_toman(p_sekke, 15000000, 350000000, old_m.get("sekke") or 238480000)

          final_ons = p_ons if (p_ons and 1000 <= p_ons <= 8000) else (old_m.get("ons") or 4285.0)

          gold24 = int(final_gold18 * (24 / 18))
          used18 = int(final_gold18 * 0.985)

          markets = {
              "gold18": final_gold18,
              "gold24": gold24,
              "used18": used18,
              "ons": final_ons,
              "usd": final_usd,
              "eur": final_eur,
              "sekke": final_sekke
          }

          def get_change(new_val, key):
              if new_val is not None:
                  return round(float(new_val), 2)
              return float(old_c.get(key, 0.0))

          c_g18 = get_change(c_gold18, "gold18")
          changes = {
              "gold18": c_g18,
              "gold24": c_g18,
              "used18": c_g18,
              "ons": get_change(c_ons, "ons"),
              "usd": get_change(c_usd, "usd"),
              "eur": get_change(c_eur, "eur"),
              "sekke": get_change(c_sekke, "sekke")
          }

          tehran_time = timezone(timedelta(hours=3, minutes=30))
          now = datetime.now(tehran_time)
          date_str = now.strftime("%Y/%m/%d - %H:%M")

          payload = {
              "price": str(final_gold18),
              "unit": "تومان",
              "updated_at": date_str,
              "markets": markets,
              "changes": changes
          }

          Path("price.json").write_text(json.dumps(payload, ensure_ascii=False, indent=2), encoding="utf-8")
          print("JSON نهایی ذخیره‌شده:")
          print(json.dumps(payload, ensure_ascii=False, indent=2))
          PY

          rm -f *.html

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add price.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update prices and percentages [skip ci]" && git push)
