name: Update Gold Price

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-price:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch price and update price.json
        shell: bash
        run: |
          set -euo pipefail

          # دریافت قیمت طلای ۱۸ عیار از TGJU
          curl --fail --silent --show-error --location \
            --retry 3 \
            --connect-timeout 20 \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
            "https://www.tgju.org/profile/geram18" \
            --output geram18.html

          python3 - <<'PY'
          import json
          import re
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          html = Path("geram18.html").read_text(encoding="utf-8", errors="ignore")

          # استخراج قیمت ۱۸ عیار (ریال)
          match = re.search(r'class="info-price"[^>]*>([^<]+)<', html)
          if not match:
              match = re.search(r'data-price="([^"]+)"', html)

          if match:
              raw_price = match.group(1).replace(",", "").strip()
              # تبدیل ریال به تومان
              price_toman = int(float(raw_price) // 10)
          else:
              price_toman = 23995800 # قیمت رزرو در صورت خطا

          # محاسبات تقریبی عیار ۲۴ و دست دوم جهت پر شدن کامل جدول شما
          price_24 = int(price_toman * (24 / 18))
          price_used = int(price_toman * 0.985)

          tehran_time = timezone(timedelta(hours=3, minutes=30))
          now = datetime.now(tehran_time)
          time_str = now.strftime("%H:%M")
          date_str = now.strftime("%Y/%m/%d - %H:%M")

          # ساختار همگام با جاوااسکریپت صفحه شما
          data = {
              "price": str(price_toman),
              "unit": "تومان",
              "updated_at": date_str,
              "markets": {
                  "gold18": price_toman,
                  "gold24": price_24,
                  "used18": price_used,
                  "ons": None,
                  "usd": None,
                  "eur": None,
                  "sekke": None
              },
              "changes": {
                  "gold18": 0.0,
                  "gold24": 0.0,
                  "used18": 0.0,
                  "ons": 0.0,
                  "usd": 0.0,
                  "eur": 0.0,
                  "sekke": 0.0
              }
          }

          Path("price.json").write_text(json.dumps(data, ensure_ascii=False, indent=2), encoding="utf-8")
          print("OK: price updated to", price_toman)
          PY

          rm -f geram18.html

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add price.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update prices [skip ci]" && git push)
