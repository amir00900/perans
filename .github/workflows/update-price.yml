name: Update Gold Price

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-price:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch prices and update price.json
        shell: bash
        run: |
          set -euo pipefail

          curl --fail --silent --show-error --location \
            --retry 3 \
            --connect-timeout 20 \
            --max-time 60 \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
            "https://www.tgju.org/" \
            --output tgju.html

          python3 - <<'PY'
          import json
          import re
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          html = Path("tgju.html").read_text(encoding="utf-8", errors="ignore")

          def normalize(s: str) -> str:
              trans = str.maketrans({
                  "۰": "0", "۱": "1", "۲": "2", "۳": "3", "۴": "4",
                  "۵": "5", "۶": "6", "۷": "7", "۸": "8", "۹": "9",
                  "٠": "0", "١": "1", "٢": "2", "٣": "3", "٤": "4",
                  "٥": "5", "٦": "6", "٧": "7", "٨": "8", "٩": "9",
              })
              return s.translate(trans)

          def extract_item(market_key):
              # پیدا کردن بلاک سطر مربوط به این نماد در جدول TGJU
              pattern = rf'data-market-row=["\']?{re.escape(market_key)}["\']?[\s\S]*?</tr>'
              match = re.search(pattern, html, re.IGNORECASE)
              
              price = None
              change = None
              
              if match:
                  block = match.group(0)
                  # استخراج قیمت (data-value یا داخل تگ td/span)
                  price_match = re.search(r'class=["\'][^"\']*info-price[^"\']*["\'][^>]*>([^<]+)<', block)
                  if price_match:
                      raw_p = normalize(price_match.group(1)).replace(",", "").strip()
                      try:
                          val = float(raw_p)
                          price = int(val)
                      except ValueError:
                          pass
                  
                  # استخراج درصد تغییرات
                  change_match = re.search(r'class=["\'][^"\']*info-change[^"\']*["\'][^>]*>([^<]+)<', block)
                  if change_match:
                      raw_c = normalize(change_match.group(1)).replace("%", "").replace(",", "").strip()
                      # بررسی مثبت یا منفی بودن
                      sign = -1 if ("low" in block or "minus" in block or "-" in raw_c) else 1
                      try:
                          change = abs(float(re.findall(r"[-+]?\d*\.?\d+", raw_c)[0])) * sign
                      except Exception:
                          pass

              return price, change

          # کلیدهای TGJU برای بازارها
          targets = {
              "usd": "price_dollar_rl",
              "eur": "price_eur",
              "sekke": "retail_sekke",
              "ons": "ons",
              "gold18": "geram18",
              "gold24": "geram24",
              "used18": "gold_mini" # یا طلای دست دوم
          }

          markets = {}
          changes = {}

          for key, tgju_key in targets.items():
              p, c = extract_item(tgju_key)
              
              # تبدیل قیمت‌های ریال به تومان (به جز انس جهانی که دلاری است)
              if p is not None and key != "ons":
                  p = p // 10
              
              markets[key] = p
              changes[key] = c

          # در صورتی که طلای ۲۴ عیار یا دست‌دوم در صفحه اول نبود، محاسبه استاندارد بر اساس ۱۸ عیار:
          if markets.get("gold18"):
              g18 = markets["gold18"]
              if not markets.get("gold24"):
                  markets["gold24"] = int(g18 * (24 / 18))
                  changes["gold24"] = changes.get("gold18", 0)
              if not markets.get("used18"):
                  markets["used18"] = int(g18 * 0.985) # تقریب طلای دست دوم
                  changes["used18"] = changes.get("gold18", 0)

          tehran_time = timezone(timedelta(hours=3, minutes=30))
          now = datetime.now(tehran_time)
          
          # تاریخ شمسی/میلادی به وقت تهران
          updated_at = now.strftime("%Y/%m/%d - %H:%M")

          payload = {
              "price": str(markets.get("gold18", "")),
              "unit": "تومان",
              "markets": markets,
              "changes": changes,
              "updated_at": updated_at
          }

          Path("price.json").write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )
          print("Updated price.json successfully:")
          print(json.dumps(payload, ensure_ascii=False, indent=2))
          PY

          rm -f tgju.html

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add price.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update all gold & currency market prices [skip ci]" && git push)
