      - name: Fetch price and update price.json
        shell: bash
        run: |
          set -euo pipefail

          curl --fail --silent --show-error --location \
            --retry 3 \
            --connect-timeout 20 \
            --max-time 60 \
            -A "Mozilla/5.0 (compatible; GoldPriceBot/1.0)" \
            "https://www.tgju.org/profile/geram18" \
            --output geram18.html

          python3 - <<'PY'
          import json
          import re
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          html = Path("geram18.html").read_text(encoding="utf-8")

          def normalize_digits(value):
              translation = str.maketrans({
                  "۰": "0", "۱": "1", "۲": "2", "۳": "3", "۴": "4",
                  "۵": "5", "۶": "6", "۷": "7", "۸": "8", "۹": "9",
                  "٠": "0", "١": "1", "٢": "2", "٣": "3", "٤": "4",
                  "٥": "5", "٦": "6", "٧": "7", "٨": "8", "٩": "9",
              })
              return value.translate(translation)

          text = normalize_digits(html)
          text = text.replace("ك", "ک").replace("ي", "ی")
          text = re.sub(r"\s+", " ", text)

          match = re.search(r"طلا\s*۱۸.*?(\d{3}(?:,\d{3}){2})", text)
          if not match:
              match = re.search(r"طلای\s*۱۸.*?(\d{3}(?:,\d{3}){2})", text)
          if not match:
              match = re.search(r"(\d{3}(?:,\d{3}){2}).*?طلا\s*۱۸", text)
          if not match:
              match = re.search(r"(\d{3}(?:,\d{3}){2}).*?طلای\s*۱۸", text)

          if not match:
              print("Could not find a valid 18K gold price in TGJU HTML.")
              print("HTML length:", len(html))
              raise SystemExit(1)

          price_rial = int(match.group(1).replace(",", ""))
          price_toman = price_rial // 10

          tehran_time = timezone(timedelta(hours=3, minutes=30))
          updated_at = datetime.now(tehran_time).strftime("%Y/%m/%d - %H:%M")

          price_data = {
              "price": str(price_toman),
              "unit": "تومان",
              "updated_at": updated_at
          }

          Path("price.json").write_text(
              json.dumps(price_data, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )

          print("Price in rial:", price_rial)
          print("Price in toman:", price_toman)
          print(json.dumps(price_data, ensure_ascii=False, indent=2))
          PY
