name: Update Gold Price

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-price:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch prices and update price.json
        shell: bash
        run: |
          set -euo pipefail
          
          # دریافت صفحه اصلی قیمت‌ها (چون همه قیمت‌ها را یکجا دارد)
          curl --fail --silent --show-error --location \
            --retry 3 \
            --connect-timeout 20 \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
            "https://www.tgju.org/" \
            --output dashboard.html

          python3 - <<'PY'
          import json
          import re
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          html = Path("dashboard.html").read_text(encoding="utf-8", errors="ignore")

          def extract_price(text, label):
              # جستجوی الگوی قیمت در سطر مربوطه
              # فرض بر ساختار جدول سایت است که قیمت‌ها را در فیلد p-price نشان می‌دهد
              pattern = rf'{label}.*?p-price.*?>(.*?)<'
              match = re.search(pattern, text, re.DOTALL)
              if match:
                  return match.group(1).strip().replace(",", "")
              return "0"

          def extract_change(text, label):
              pattern = rf'{label}.*?change.*?>(.*?)<'
              match = re.search(pattern, text, re.DOTALL)
              if match:
                  return match.group(1).strip().replace("%", "").replace(",", "")
              return "0"

          # استخراج داده‌ها (نام‌ها مطابق کلاس‌های سایت مرجع تنظیم شده‌اند)
          data = {
              "markets": {
                  "usd": extract_price(html, "price-dollar"),
                  "eur": extract_price(html, "price-eur"),
                  "sekke": extract_price(html, "sekke"),
                  "ons": extract_price(html, "ons"),
                  "gold18": extract_price(html, "geram18"),
                  "gold24": extract_price(html, "mesghal"), # یا عیار ۲۴
                  "used18": extract_price(html, "gold-used") # برخی سایت‌ها ندارند، چک کنید
              },
              "changes": {
                  "usd": extract_change(html, "price-dollar"),
                  "eur": extract_change(html, "price-eur"),
                  "sekke": extract_change(html, "sekke"),
                  "ons": extract_change(html, "ons"),
                  "gold18": extract_change(html, "geram18"),
                  "gold24": extract_change(html, "mesghal"),
                  "used18": extract_change(html, "gold-used")
              },
              "updated_at": datetime.now(timezone(timedelta(hours=3, minutes=30))).strftime("%H:%M")
          }

          Path("price.json").write_text(json.dumps(data, ensure_ascii=False, indent=2), encoding="utf-8")
          PY

          rm -f dashboard.html

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add price.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update prices [skip ci]" && git push)
