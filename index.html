<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>پرنس گلد گالری</title>
  <style>
    :root{ --bg:#fdfdfd; --gold:#d4af37; --text:#333; }
    body{margin:0; font-family: Tahoma, sans-serif; background:var(--bg);}
    .container{max-width:1200px; margin:0 auto; padding:0 20px}

    /* نوار تماس */
    .top-bar { background: #eee; padding: 5px 20px; font-size: 0.75rem; display: flex; justify-content: space-between; align-items: center; }
    .top-bar a { color: var(--text); text-decoration: none; margin-left: 10px; }

    /* نوار قیمت */
    .gold-ticker { background: #fdfaf5; color: #8b7355; padding: 8px 0; text-align: center; border-bottom: 1px solid #e5dcc3; font-size: 0.8rem; }
    .gold-ticker a { color: inherit; text-decoration: none; }

    /* بنر تمام‌صفحه */
    .hero-full { height: 90vh; background: url('ax/gold-jewelry-collection-hero.webp') no-repeat center center; background-size: cover; display: flex; flex-direction: column; }

    /* هدر */
    .header-nav { display: flex; align-items: center; padding: 20px 0; color: white; gap: 15px; }
    .logo-area { display: flex; align-items: center; gap: 15px; font-size: 1.2rem; font-weight: bold; }
    .logo-area img { width: 60px; border-radius: 15px; border: 2px solid white; }

    /* کادر متن بنر */
    .hero-content { flex: 1; display: flex; align-items: center; justify-content: flex-start; }
    .hero-box { background: rgba(255, 255, 255, 0.9); padding: 40px; border-radius: 20px; max-width: 450px; text-align: right; }
    .hero-box h1 { margin-top: 0; color: #222; }
    .hero-box p { color: #555; line-height: 1.9; }
    .btn-gold { background: var(--gold); color: #fff; padding: 12px 30px; border-radius: 8px; display: inline-block; font-weight: bold; margin-top: 20px; text-decoration: none; }

    @media (max-width: 768px) {
      .top-bar {
        flex-direction: column;
        gap: 6px;
        text-align: center;
      }

      .hero-full {
        height: auto;
        min-height: 90vh;
      }

      .hero-content {
        padding: 40px 0;
      }

      .hero-box {
        padding: 28px 20px;
        max-width: 100%;
      }
    }
  </style>
</head>
<body>

  <!-- نوار تماس -->
  <div class="top-bar">
    <div>تلفن سفارش: ۰۹۳۷۴۴۸۷۳۴۹</div>
    <div>
      <a href="https://www.instagram.com/peransgoldgallery">اینستاگرام</a>
      <a href="https://ble.ir/peransgoldgallery">بله</a>
      <a href="https://wa.me/989374487349">واتس‌اپ</a>
    </div>
  </div>

  <!-- نوار قیمت -->
  <div class="gold-ticker">
    <a href="gold-price.html">نرخ لحظه‌ای طلای ۱۸ عیار: <span id="goldPrice">در حال دریافت...</span></a>
  </div>

  <!-- بنر -->
  <section class="hero-full">
    <div class="container">
      <header class="header-nav">
        <div class="logo-area">
          <img src="ax/logo.png" alt="Logo">
          <span>گالری پرنس</span>
        </div>
      </header>

      <div class="hero-content">
        <div class="hero-box">
          <h1>پرنس گلد گالری</h1>
          <p>مناسب هدیه و سرمایه‌گذاری؛ زیبایی در سادگی.</p>
          <a href="https://ble.ir/peransgoldgallery" class="btn-gold">مشاهده محصولات</a>
        </div>
      </div>
    </div>
  </section>

  <script>
    function toPersianDigits(value) {
      const persianDigits = ['۰', '۱', '۲', '۳', '۴', '۵', '۶', '۷', '۸', '۹'];
      return String(value).replace(/\d/g, function(digit) {
        return persianDigits[digit];
      });
    }

    function formatPrice(value) {
      const numberValue = parseInt(String(value).replace(/[^\d]/g, ''), 10);
      if (isNaN(numberValue) || numberValue <= 0) {
        return null;
      }
      return toPersianDigits(numberValue.toLocaleString('en-US')) + ' تومان';
    }

    async function fetchGoldPrice() {
      const display = document.getElementById('goldPrice');

      try {
        const response = await fetch('./price.json?nocache=' + Date.now(), {
          method: 'GET',
          headers: {
            'Cache-Control': 'no-cache, no-store, must-revalidate',
            'Pragma': 'no-cache',
            'Expires': '0'
          }
        });

        if (!response.ok) {
          throw new Error('price.json not found: ' + response.status);
        }

        const data = await response.json();

        if (data && data.price) {
          const formatted = formatPrice(data.price);
          if (!formatted) {
            throw new Error('Invalid price format');
          }

          display.textContent = formatted;
          localStorage.setItem('last_gold_price', formatted);
        } else {
          throw new Error('Invalid JSON structure');
        }
      } catch (error) {
        console.error('Error updating top bar price:', error);
        display.textContent = localStorage.getItem('last_gold_price') || 'استعلام قیمت';
      }
    }

    fetchGoldPrice();
    setInterval(fetchGoldPrice, 600000);
  </script>
</body>
</html>
