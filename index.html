<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>پرنس گلد گالری</title>
    <style>
        body { background-color: #0b0b0d; color: #f5f1e8; font-family: Tahoma, sans-serif; margin: 0; padding: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; max-width: 1000px; margin: auto; }
        .card { background: #121216; border: 1px solid #d4af3730; padding: 20px; border-radius: 15px; text-align: center; }
        h1 { text-align: center; color: #d4af37; }
        .price { color: #d4af37; font-weight: bold; margin-top: 10px; display: block; }
    </style>
</head>
<body>
    <h1>ویترین پرنس گلد</h1>
    <div class="grid" id="product-list">در حال بارگذاری...</div>

    <script>
        fetch('products.json')
            .then(res => res.json())
            .then(data => {
                const list = document.getElementById('product-list');
                list.innerHTML = data.filter(p => p.visible).map(p => `
                    <div class="card">
                        <h3>${p.title}</h3>
                        <p>${p.description}</p>
                        <span class="price">${p.price}</span>
                    </div>
                `).join('');
            });
    </script>
</body>
</html>
