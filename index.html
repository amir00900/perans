<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>سایت من</title>
  <style>
    body{
      margin:0;
      font-family:tahoma, sans-serif;
      background:#f7f7f7;
      color:#222;
      line-height:1.9;
    }
    .container{
      max-width:900px;
      margin:0 auto;
      padding:40px 20px;
    }
    .card{
      background:#fff;
      border-radius:16px;
      padding:32px;
      box-shadow:0 8px 24px rgba(0,0,0,.08);
    }
    h1{
      margin-top:0;
      color:#111;
    }
    .contact a{
      display:block;
      margin:8px 0;
      color:#0057b8;
      text-decoration:none;
    }
    .contact a:hover{
      text-decoration:underline;
    }
    .section{
      margin-top:28px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>به سایت ما خوش آمدید</h1>
      <p>
        اینجا صفحه اصلی سایت است. متن معرفی کسب‌وکار یا خدماتت را اینجا قرار می‌دهیم.
      </p>

      <div class="section contact">
        <h2>تماس با ما</h2>
        <a href="https://instagram.com/" target="_blank">اینستاگرام</a>
        <a href="https://t.me/" target="_blank">تلگرام</a>
        <a href="mailto:info@example.com">ایمیل</a>
        <a href="tel:+989000000000">شماره تماس</a>
      </div>
    </div>
  </div>
</body>
</html>
