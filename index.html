<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>پرَنس گالری</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- هدر -->
  <header>
    <div class="container">
      <a href="index.html" class="logo">
        <img src="assets/logo.png" alt="پرَنس گالری">
      </a>
      <nav>
        <ul>
          <li><a href="#home">خانه</a></li>
          <li><a href="#products">محصولات</a></li>
          <li><a href="#contact">تماس</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- بخش اصلی با تصویر زمینه -->
  <section id="home" class="hero">
    <h1>خرید امن و آنلاین طلا</h1>
    <p>قیمت لحظه‌ای، تحویل سریع</p>
    <button onclick="scrollToSection('products')">مشاهده محصولات</button>
  </section>

  <!-- نمایش قیمت روز طلا -->
  <section class="gold-price">
    <div class="container">
      <h2>قیمت امروز طلا</h2>
      <p id="gold-price">در حال بارگذاری...</p>
    </div>
  </section>

  <!-- محصولات (نمونه) -->
  <section id="products" class="products">
    <div class="container">
      <h2>محصولات ما</h2>
      <!-- کارت‌های نمونه -->
      <div class="product-list">
        <div class="product-card">
          <img src="assets/product1.jpg" alt="محصول1">
          <h3>دستبند طلا</h3>
          <p>وزن: ۵ گرم</p>
        </div>
        <!-- … -->
      </div>
    </div>
  </section>

  <!-- فوتر با لینک به بله و اینستاگرام -->
  <footer id="contact">
    <div class="container">
      <div class="social">
        <a href="https://ble.ir/channel/YourChannel" target="_blank">
          <img src="assets/bale-icon.png" alt="بله">
        </a>
        <a href="https://instagram.com/YourInsta" target="_blank">
          <img src="assets/insta-icon.png" alt="اینستاگرام">
        </a>
      </div>
      <p>© تمامی حقوق برای پرَنس گالری محفوظ است.</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
