<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>پرنس گلد | Perans Gold Gallery</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;700;900&display=swap');
    
    :root {
      --bg: #0a0a0a;
      --panel: #121212;
      --gold: #d4af37;
      --gold-bright: #f1d279;
      --text: #e0e0e0;
      --muted: #888;
      --line: rgba(212, 175, 55, 0.1);
    }

    * { box-sizing: border-box; transition: all 0.3s ease; }
    body { 
      margin: 0; font-family: 'Vazirmatn', sans-serif; 
      background-color: var(--bg); color: var(--text); line-height: 1.6;
    }

    .container { width: min(1200px, 92%); margin: auto; }

    /* Header */
    header {
      padding: 20px 0; border-bottom: 1px solid var(--line);
      backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 1000;
    }
    .nav { display: flex; justify-content: space-between; align-items: center; }
    .logo { font-weight: 900; font-size: 1.5rem; color: var(--gold-bright); letter-spacing: 2px; }

    /* Hero Slider Style */
    .hero {
      height: 80vh; margin: 20px 0; border-radius: 30px;
      background: linear-gradient(to right, rgba(0,0,0,0.8), transparent), url('/van-cleef-5.webp') center/cover;
      display: flex; align-items: center; padding: 60px;
      position: relative; overflow: hidden; border: 1px solid var(--line);
    }
    .hero-text h1 { font-size: clamp(2.5rem, 6vw, 4.5rem); margin: 0; line-height: 1.1; }
    .hero-text p { font-size: 1.2rem; color: var(--gold); margin: 20px 0; }

    /* Categories (Kimiya Style) */
    .categories {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 20px; margin: 60px 0;
    }
    .cat-item {
      background: var(--panel); padding: 30px 10px; border-radius: 20px;
      text-align: center; border: 1px solid var(--line); cursor: pointer;
    }
    .cat-item:hover { background: var(--gold); color: #000; transform: translateY(-10px); }
    .cat-item img { width: 50px; margin-bottom: 10px; filter: brightness(0) invert(1); }

    /* Product Grid */
    .section-title { font-size: 2rem; margin-bottom: 30px; display: flex; align-items: center; gap: 15px; }
    .section-title::after { content: ""; height: 2px; flex: 1; background: var(--line); }
    
    .grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 30px;
    }
    .product-card {
      background: var(--panel); border-radius: 20px; overflow: hidden;
      border: 1px solid var(--line); position: relative;
    }
    .product-card:hover { border-color: var(--gold); }
    .product-img { width: 100%; aspect-ratio: 1; object-fit: cover; }
    .product-info { padding: 20px; text-align: center; }
    .price { color: var(--gold-bright); font-weight: bold; font-size: 1.2rem; margin-top: 10px; display: block; }

    /* CTA Button */
    .btn {
      display: inline-block; padding: 12px 35px; background: var(--gold);
      color: #000; text-decoration: none; border-radius: 50px; font-weight: bold;
    }

    @media (max-width: 768px) {
      .hero { padding: 30px; text-align: center; justify-content: center; background-position: center; }
    }
  </style>
</head>
<body>

  <header>
    <div class="container nav">
      <div class="logo">PERANS GOLD</div>
      <nav>
        <a href="https://ble.ir/peransgoldgallery" class="btn">ارتباط سریع</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <!-- Main Slider Section -->
    <section class="hero">
      <div class="hero-text">
        <h1>درخشش<br><span style="color:var(--gold-bright)">اصالت</span></h1>
        <p>کالکشن جدید ونکلیف رسید</p>
        <a href="#gallery" class="btn">مشاهده محصولات</a>
      </div>
    </section>

    <!-- Categories Section -->
    <div class="categories">
      <div class="cat-item">گردنبند</div>
      <div class="cat-item">دستبند</div>
      <div class="cat-item">انگشتر</div>
      <div class="cat-item">گوشواره</div>
      <div class="cat-item">پابند</div>
    </div>

    <!-- Products Gallery -->
    <h2 class="section-title">جدیدترین‌های پرنس</h2>
    <div class="grid" id="gallery">
      <!-- محصول ۱ (ونکلیف شما) -->
      <div class="product-card">
        <img src="/van-cleef-5.webp" class="product-img" alt="ونکلیف">
        <div class="product-info">
          <h3>گردنبند ونکلیف کلاسیک</h3>
          <span class="price">استعلام قیمت در بله</span>
        </div>
      </div>
      
      <!-- نمونه محصولات دیگر -->
      <div class="product-card">
        <img src="https://images.unsplash.com/photo-1611591437281-460bfbe1220a?auto=format&fit=crop&w=600" class="product-img" alt="محصول">
        <div class="product-info">
          <h3>دستبند کارتیر لوکس</h3>
          <span class="price">سفارش اختصاصی</span>
        </div>
      </div>
    </div>
  </main>

  <footer style="margin-top: 100px; padding: 50px 0; text-align: center; border-top: 1px solid var(--line); color: var(--muted);">
    <p>تمام حقوق برای گالری پرنس محفوظ است - ۲۰۲۶</p>
  </footer>

</body>
</html>
