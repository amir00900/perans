<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>پرنس گلد | طلا و جواهرات لوکس</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;700&display=swap');
    :root{
      --bg:#0f0d0b; --text:#f5efe5; --gold:#d8b46c; --gold-2:#f0d79a;
      --line:rgba(214,178,110,.15); --shadow:0 15px 40px rgba(0,0,0,.5);
    }
    *{box-sizing:border-box}
    body{
      margin:0; font-family:"Vazirmatn",sans-serif; color:var(--text); background:var(--bg); overflow-x:hidden;
    }
    .container{width:min(1140px,calc(100% - 32px)); margin:auto}
    
    /* Header */
    header{ border-bottom:1px solid var(--line); padding:15px 0; background:rgba(15,13,11,.9); position:sticky; top:0; z-index:100;}
    .nav{display:flex; justify-content:space-between; align-items:center}
    .brand strong{font-size:1.2rem; color:var(--gold-2); display:block}
    .brand span{font-size:.7rem; letter-spacing:2px; color:#c7bca9}
    
    /* Hero */
    .hero{padding:40px 0; display:grid; grid-template-columns:1fr 1fr; gap:20px; min-height:80vh; align-items:center}
    .hero-content{padding-right:20px}
    h1{font-size:clamp(2rem, 5vw, 4rem); line-height:1.2; margin:0}
    h1 span{color:var(--gold); display:block}
    .hero-p{color:#c7bca9; line-height:1.8; margin:20px 0; font-size:1.1rem}
    
    /* Image Box */
    .hero-img{
      height:550px; border-radius:20px; border:1px solid var(--line);
      background: url('/van-cleef-5.webp') center/cover no-repeat;
      box-shadow:var(--shadow);
    }
    
    /* Buttons */
    .btn{
      display:inline-flex; padding:12px 25px; border-radius:50px; text-decoration:none; 
      font-weight:bold; transition:.3s; border:1px solid var(--gold);
    }
    .primary{background:var(--gold); color:#1a140e}
    .primary:hover{transform:translateY(-3px); box-shadow:0 10px 20px rgba(216,180,108,.3)}

    /* Gallery Section */
    .section-title{text-align:center; margin:60px 0 30px; font-size:1.8rem; color:var(--gold-2)}
    .gallery{display:grid; grid-template-columns:repeat(auto-fit, minmax(250px, 1fr)); gap:15px; margin-bottom:50px}
    .item{aspect-ratio:1/1; border-radius:15px; overflow:hidden; border:1px solid var(--line); position:relative}
    .item img{width:100%; height:100%; object-fit:cover; transition:.5s}
    .item:hover img{transform:scale(1.1)}
    
    @media (max-width:850px){
      .hero{grid-template-columns:1fr; text-align:center}
      .hero-content{padding:0}
      .hero-img{height:350px; order:-1}
    }
  </style>
</head>
<body>

  <header>
    <div class="container nav">
      <div class="brand">
        <strong>پرنس گلد</strong>
        <span>PERANS GOLD</span>
      </div>
      <nav>
        <a href="https://ble.ir/peransgoldgallery" style="color:var(--gold); text-decoration:none; font-weight:bold">ارتباط با ما</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <div class="hero-content">
        <h1>ظرافت طلا در<span>کالکشن ونکلیف</span></h1>
        <p class="hero-p">طراحی‌های خاص و منحصر‌به‌فرد برای کسانی که به دنبال درخشش متفاوتی هستند. تمام قطعات با طلای ۱۸ عیار و دقت فراوان ساخته شده‌اند.</p>
        <a href="https://ble.ir/peransgoldgallery" class="btn primary">مشاهده قیمت و سفارش</a>
      </div>
      <div class="hero-img"></div>
    </section>

    <h2 class="section-title">ویترین محصولات</h2>
    <section class="gallery">
      <!-- تصویر ونکلیف در کادر اول گالری -->
      <div class="item">
        <img src="/van-cleef-5.webp" alt="گردنبند ونکلیف">
      </div>
      <div class="item">
        <img src="https://images.unsplash.com/photo-1617038220318-5c3726a9f5b7?auto=format&fit=crop&w=600" alt="محصول ۲">
      </div>
      <div class="item">
        <img src="https://images.unsplash.com/photo-1611591437281-460bfbe1220a?auto=format&fit=crop&w=600" alt="محصول ۳">
      </div>
      <div class="item">
        <img src="https://images.unsplash.com/photo-1617038220315-8ec0b0c2c4f4?auto=format&fit=crop&w=600" alt="محصول ۴">
      </div>
    </section>
  </main>

  <footer style="text-align:center; padding:40px; color:#666; border-top:1px solid var(--line)">
    © 2026 گالری پرنس گلد | تمامی حقوق محفوظ است.
  </footer>

</body>
</html>
