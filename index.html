<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>پرنس گلد گالری | Perans Gold Gallery</title>
  <link rel="icon" type="image/png" href="ax/logo.png">
  
  <!-- فونت‌های استاندارد وب برای دسکتاپ و موبایل -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/lalezar-font@v1.0.0/dist/font-face.css">

  <style>
    @font-face {
      font-family: 'IranNastaliqWeb';
      src: url('https://cdn.jsdelivr.net/gh/rastikerdar/iran-nastaliq-font@v1.0.0/dist/IranNastaliq.woff2') format('woff2'),
           url('https://cdn.jsdelivr.net/gh/rastikerdar/iran-nastaliq-font@v1.0.0/dist/IranNastaliq.woff') format('woff'),
           url('https://cdn.jsdelivr.net/gh/rastikerdar/iran-nastaliq-font@v1.0.0/dist/IranNastaliq.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --bg-main: #fbfaf8;
      --gold-primary: #c5a059;
      --gold-dark: #96702d;
      --gold-hover: #b08b44;
      --gold-light: #fbf8f2;
      --gold-border: rgba(197, 160, 89, 0.28);
      --text-dark: #222222;
      --text-muted: #5f5b53;
      --card-shadow: 0 25px 50px -12px rgba(184, 142, 62, 0.12), 0 0 0 1px rgba(197, 160, 89, 0.18);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      overflow-x: hidden;
    }

    body {
      font-family: "Vazirmatn", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Tahoma, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-dark);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      line-height: 1.6;
    }

    /* نوار نرخ لحظه‌ای طلا */
    .gold-ticker {
      width: 100%;
      background: #ffffff;
      border-bottom: 1px solid var(--gold-border);
      padding: 11px 16px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.02);
    }

    .gold-ticker a {
      text-decoration: none;
      color: var(--text-dark);
      font-size: 13.5px;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: color 0.2s ease;
      flex-wrap: wrap;
    }

    .gold-ticker a:hover {
      color: var(--gold-hover);
    }

    .live-dot {
      width: 8px;
      height: 8px;
      background-color: #2e7d32;
      border-radius: 50%;
      display: inline-block;
      box-shadow: 0 0 0 3px rgba(46, 125, 50, 0.18);
      animation: pulse 2s infinite;
      flex: 0 0 auto;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(46, 125, 50, 0.4); }
      70% { box-shadow: 0 0 0 6px rgba(46, 125, 50, 0); }
      100% { box-shadow: 0 0 0 0 rgba(46, 125, 50, 0); }
    }

    .price-val {
      font-weight: 700;
      color: var(--gold-dark);
      margin: 0 4px;
      letter-spacing: 0.5px;
    }

    /* کادر بدنه اصلی */
    .hero-container {
      width: 100%;
      max-width: 1100px;
      padding: 36px 20px 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
    }

    .hero-card {
      width: 100%;
      background: #ffffff;
      border-radius: 32px;
      overflow: hidden;
      box-shadow: var(--card-shadow);
      border: 1px solid var(--gold-border);
      position: relative;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .hero-image-wrapper {
      width: 100%;
      height: 390px;
      position: relative;
      background-color: #f4efe6;
      overflow: hidden;
    }

    .hero-image-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.6s ease;
    }

    .hero-card:hover .hero-image-wrapper img {
      transform: scale(1.02);
    }

    .hero-image-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(255,255,255,0.02) 0%, rgba(255,255,255,0.25) 50%, rgba(255,255,255,0.98) 100%);
    }

    /* بخش محتوای متنی و لوگو */
    .hero-content {
      padding: 0 32px 40px;
      margin-top: -68px;
      position: relative;
      z-index: 10;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .brand-logo-wrapper {
      width: 106px;
      height: 106px;
      background: #ffffff;
      border-radius: 50%;
      padding: 11px;
      box-shadow: 0 12px 30px rgba(184, 142, 62, 0.18);
      border: 2px solid var(--gold-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 14px;
      overflow: hidden;
      background-clip: padding-box;
    }

    .brand-logo-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    /* عنوان خوشنویسی برند با لود مطمئن */
    .brand-title {
      font-family: 'IranNastaliqWeb', 'IranNastaliq', 'Lalezar', 'Vazirmatn', Tahoma, sans-serif !important;
      font-size: 44px;
      font-weight: normal;
      line-height: 1.8;
      margin-bottom: 4px;
      color: #b08738;
      background: linear-gradient(135deg, #d8b267 0%, #b88d3e 40%, #7e5a1b 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 2px 10px rgba(197, 160, 89, 0.2);
      letter-spacing: 0;
      padding: 0 10px;
      display: block;
    }

    .brand-subtitle {
      font-size: 15px;
      color: var(--text-muted);
      max-width: 540px;
      margin-bottom: 30px;
      font-weight: 400;
      line-height: 1.8;
    }

    /* دکمه‌ها و افکت شاین طلایی */
    .actions-group {
      display: flex;
      gap: 16px;
      width: 100%;
      max-width: 450px;
      justify-content: center;
    }

    .btn-primary {
      flex: 1.25;
      position: relative;
      overflow: hidden;
      background: linear-gradient(135deg, #c5a059 0%, #a8823b 100%);
      color: #ffffff;
      padding: 14px 22px;
      border-radius: 14px;
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 22px rgba(197, 160, 89, 0.32);
      transition: all 0.25s ease;
      border: none;
      font-family: inherit;
    }

    .btn-primary::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -60%;
      width: 40%;
      height: 200%;
      background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.4) 50%, rgba(255,255,255,0) 100%);
      transform: rotate(25deg);
      transition: none;
    }

    .btn-primary:hover::after {
      left: 130%;
      transition: all 0.75s ease-in-out;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 28px rgba(197, 160, 89, 0.45);
    }

    .btn-secondary {
      flex: 1;
      background: var(--gold-light);
      color: var(--gold-dark);
      padding: 14px 20px;
      border-radius: 14px;
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--gold-border);
      transition: all 0.25s ease;
      font-family: inherit;
    }

    .btn-secondary:hover {
      background: #f4ecdc;
      color: #1a1a1a;
      transform: translateY(-2px);
      border-color: rgba(197, 160, 89, 0.5);
    }

    /* فوتر مینیمال */
    .site-footer {
      width: 100%;
      padding: 20px 16px 26px;
      text-align: center;
      color: #7a7266;
      font-size: 13px;
      letter-spacing: 0.2px;
      border-top: 1px solid rgba(197, 160, 89, 0.18);
      margin-top: auto;
      background: rgba(255, 255, 255, 0.7);
    }

    .site-footer p {
      margin: 0;
      line-height: 1.8;
    }

    /* بهینه‌سازی دقیق موبایل */
    @media (max-width: 600px) {
      .hero-container {
        padding: 16px 14px 32px;
      }

      .hero-image-wrapper {
        height: 245px;
      }

      .hero-content {
        padding: 0 16px 30px;
        margin-top: -52px;
      }

      .brand-logo-wrapper {
        width: 86px;
        height: 86px;
        margin-bottom: 10px;
      }

      .brand-title {
        font-size: 36px !important;
        line-height: 1.75;
      }

      .brand-subtitle {
        font-size: 13.5px;
        margin-bottom: 24px;
      }

      .actions-group {
        flex-direction: column;
        width: 100%;
        gap: 11px;
      }

      .btn-primary,
      .btn-secondary {
        width: 100%;
        padding: 13.5px;
        font-size: 14.5px;
      }

      .site-footer {
        padding: 18px 14px 22px;
        font-size: 12.5px;
      }
    }
  </style>
</head>
<body>

  <!-- نوار نرخ لحظه‌ای طلا -->
  <div class="gold-ticker">
    <a href="gold-price.html" title="مشاهده نمودار و جزئیات قیمت">
      <span class="live-dot"></span>
      <span>نرخ لحظه‌ای طلای ۱۸ عیار:</span>
      <span id="goldPrice" class="price-val">در حال دریافت...</span>
      <span>تومان</span>
    </a>
  </div>

  <!-- کادر اصلی -->
  <main class="hero-container">
    <div class="hero-card">
      <div class="hero-image-wrapper">
        <img src="ax/gold-jewelry-collection-hero.webp" alt="مجموعه جواهرات پرنس گلد">
        <div class="hero-image-overlay"></div>
      </div>
      
      <div class="hero-content">
        <div class="brand-logo-wrapper">
          <img src="ax/logo.png" alt="لوگوی پرنس گلد">
        </div>
        
        <h1 class="brand-title">پرنس گلد گالری</h1>
        <p class="brand-subtitle">طلا های مینیمال مناسب هدیه و سرمایه‌گذاری؛ درخشش زیبایی در نهایت ظرافت و سادگی</p>
        
        <div class="actions-group">
          <a href="https://ble.ir/peransgoldgallery" class="btn-primary" target="_blank" rel="noopener noreferrer">
            مشاهده محصولات
          </a>
          <a href="contact.html" class="btn-secondary">
            راه‌های ارتباطی
          </a>
        </div>
      </div>
    </div>
  </main>

  <!-- فوتر ساده و لوکس بدون شماره -->
  <footer class="site-footer">
    <p>گالری طلا و جواهر پرنس</p>
  </footer>

  <!-- اسکریپت دریافت قیمت لحظه‌ای طلا -->
  <script>
    function toPersianDigits(n) {
      if (n === null || n === undefined) return '';
      const f = ['۰','۱','۲','۳','۴','۵','۶','۷','۸','۹'];
      return n.toString().replace(/[0-9]/g, function(w) {
        return f[+w];
      });
    }

    function formatPrice(val) {
      if (!val) return 'استعلام قیمت';
      const num = parseInt(val, 10);
      if (isNaN(num)) return 'استعلام قیمت';
      return toPersianDigits(num.toLocaleString('fa-IR'));
    }

    async function fetchGoldPrice() {
      const priceEl = document.getElementById('goldPrice');
      const cached = localStorage.getItem('last_gold_price');
      if (cached && priceEl && priceEl.innerText === 'در حال دریافت...') {
        priceEl.innerText = formatPrice(cached);
      }

      try {
        const res = await fetch('./price.json?nocache=' + Date.now());
        if (!res.ok) throw new Error('Network error');
        const data = await res.json();
        
        let p = null;
        if (typeof data.gold_18k === 'number') p = data.gold_18k;
        else if (data.gold_18k && data.gold_18k.price) p = data.gold_18k.price;
        else if (data.price) p = data.price;
        
        if (p && priceEl) {
          priceEl.innerText = formatPrice(p);
          localStorage.setItem('last_gold_price', p);
        }
      } catch (e) {
        if (!cached && priceEl) {
          priceEl.innerText = 'استعلام قیمت';
        }
      }
    }

    fetchGoldPrice();
    setInterval(fetchGoldPrice, 600000);
  </script>
</body>
</html>
