<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f8f5ee" />

  <title>قیمت لحظه‌ای طلا و سکه | پرنس گلد گالری</title>
  
  <link rel="icon" type="image/png" href="ax/logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --gold: #ad811a;
      --gold-dark: #6e4e08;
      --gold-light: #d6b75c;
      --ink: #2b2317;
      --muted: #6e6557;
      --line: #e8ddc7;
      --green: #568a55;
      --red: #bd4840;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: 'Vazirmatn', Tahoma, sans-serif;
      background: #fdfcf8;
    }

    /* استایل‌های طراحی لوکس و روشن که قبلاً داشتید */
    .topbar { display: flex; align-items: center; justify-content: space-between; padding: 15px 30px; border-bottom: 1px solid #e8ddc7; background: #fff; }
    .page { width: min(840px, 95%); margin: 20px auto; }
    
    .market-card { padding: 20px; border: 1px solid #e8ddc7; border-radius: 15px; background: #fff; margin-bottom: 20px; }
    .price-row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #f0f0f0; }
    .price-value { font-weight: bold; color: var(--gold-dark); }

    .change-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 15px; margin-top: 20px; }
    .change-item { padding: 10px; background: #fdfcf8; border-radius: 10px; text-align: center; border: 1px solid #eee; }
    .change-arrow { font-size: 18px; margin-right: 5px; }

    .error-message { display: none; color: var(--red); padding: 10px; text-align: center; }
  </style>
</head>

<body>
  <header class="topbar">
    <div style="font-weight: bold;">پرنس گلد گالری</div>
    <a href="index.html" style="text-decoration:none; color: var(--gold-dark);">بازگشت</a>
  </header>

  <main class="page">
    <h1 style="text-align: center;">قیمت روز بازار</h1>
    <p style="text-align: center;">تاریخ: <span id="update-time">در حال دریافت...</span></p>

    <section class="market-card">
      <div class="price-row"><span>طلای ۱۸ عیار</span><span class="price-value" id="p-gold18">—</span></div>
      <div class="price-row"><span>دلار آمریکا</span><span class="price-value" id="p-usd">—</span></div>
      <div class="price-row"><span>سکه امامی</span><span class="price-value" id="p-sekke">—</span></div>
    </section>

    <div class="change-grid" id="change-container">
        <!-- تغییرات اینجا تزریق می‌شود -->
    </div>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);

    function toPersianDigits(str) {
      return String(str).replace(/[0-9]/g, (w) => "۰۱۲۳۴۵۶۷۸۹"[+w]);
    }

    function setChange(key, value, container) {
      const v = parseFloat(value);
      const div = document.createElement('div');
      div.className = 'change-item';
      
      let arrow = "△";
      let color = "var(--green)";
      
      if (v < 0) {
        arrow = "▽";
        color = "var(--red)";
      } else if (v === 0) {
        arrow = "▬";
        color = "var(--muted)";
      }

      div.innerHTML = `
        <div style="font-size: 12px;">${key}</div>
        <div style="color: ${color}; font-weight: bold;">
            <span class="change-arrow">${arrow}</span>
            ${toPersianDigits(Math.abs(v).toFixed(2))}%
        </div>
      `;
      container.appendChild(div);
    }

    async function fetchPrices() {
      try {
        const res = await fetch("price.json?t=" + Date.now());
        const data = await res.json();
        
        setText("update-time", data.updated_at);
        setText("p-gold18", toPersianDigits(data.markets.gold18));
        setText("p-usd", toPersianDigits(data.markets.usd));
        setText("p-sekke", toPersianDigits(data.markets.sekke));

        const container = $("change-container");
        container.innerHTML = "";
        for (const [key, val] of Object.entries(data.changes)) {
            setChange(key, val, container);
        }
      } catch (e) {
        console.error(e);
      }
    }

    function setText(id, val) { if($(id)) $(id).innerText = val; }
    
    fetchPrices();
    setInterval(fetchPrices, 60000);
  </script>
</body>
</html>
