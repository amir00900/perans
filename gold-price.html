<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>قیمت طلا | پرنس گلد گالری</title>
  <style>
    :root{
      --bg:#fffdf8;
      --card:#ffffff;
      --gold:#d4af37;
      --gold-dark:#b88f1d;
      --text:#2f2f2f;
      --muted:#7a7a7a;
      --border:#eee2c5;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:Tahoma, sans-serif;
      background:var(--bg);
      color:var(--text);
    }
    .container{
      max-width:1100px;
      margin:0 auto;
      padding:24px 16px 60px;
    }
    .topbar{
      background:#faf7ef;
      border-bottom:1px solid var(--border);
      padding:10px 16px;
      font-size:.9rem;
    }
    .topbar a{
      color:var(--gold-dark);
      text-decoration:none;
      font-weight:bold;
    }
    .hero{
      margin-top:22px;
      background:linear-gradient(135deg, #fff 0%, #fffaf0 100%);
      border:1px solid var(--border);
      border-radius:24px;
      padding:28px;
      box-shadow:0 10px 30px rgba(0,0,0,.04);
    }
    .hero h1{
      margin:0 0 10px;
      font-size:2rem;
      color:#222;
    }
    .hero p{
      margin:0;
      color:var(--muted);
      line-height:1.9;
    }
    .price-box{
      margin-top:24px;
      display:grid;
      grid-template-columns:repeat(2, minmax(0,1fr));
      gap:16px;
    }
    .card{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:18px;
      padding:20px;
    }
    .label{
      color:var(--muted);
      font-size:.95rem;
      margin-bottom:8px;
    }
    .value{
      font-size:1.6rem;
      font-weight:bold;
      color:var(--gold-dark);
    }
    .big{
      grid-column:1 / -1;
      text-align:center;
      padding:28px 20px;
    }
    .big .value{
      font-size:2.2rem;
    }
    .actions{
      margin-top:22px;
      display:flex;
      gap:12px;
      flex-wrap:wrap;
    }
    .btn{
      display:inline-block;
      padding:12px 18px;
      border-radius:10px;
      text-decoration:none;
      font-weight:bold;
    }
    .btn-primary{
      background:var(--gold);
      color:#fff;
    }
    .btn-secondary{
      background:#fff;
      color:var(--text);
      border:1px solid var(--border);
    }
    .status{
      margin-top:14px;
      color:var(--muted);
      font-size:.9rem;
    }
    @media (max-width: 700px){
      .price-box{grid-template-columns:1fr}
      .hero h1{font-size:1.6rem}
      .big .value{font-size:1.8rem}
    }
  </style>
</head>
<body>

  <div class="topbar">
    <div class="container" style="padding-top:0;padding-bottom:0;">
      <a href="index.html">← بازگشت به صفحه اصلی</a>
    </div>
  </div>

  <div class="container">
    <section class="hero">
      <h1>قیمت لحظه‌ای طلا</h1>
      <p>
        این صفحه برای نمایش قیمت لحظه‌ای طلای ۱۸ عیار ساخته شده است.
        قیمت از API اختصاصی شما دریافت می‌شود.
      </p>

      <div class="price-box">
        <div class="card big">
          <div class="label">طلای ۱۸ عیار</div>
          <div class="value" id="gold18">در حال دریافت...</div>
        </div>

        <div class="card">
          <div class="label">زمان بروزرسانی</div>
          <div class="value" id="updatedAt" style="font-size:1.1rem;color:var(--text)">---</div>
        </div>

        <div class="card">
          <div class="label">واحد قیمت</div>
          <div class="value" id="unit" style="font-size:1.1rem;color:var(--text)">---</div>
        </div>
      </div>

      <div class="actions">
        <a class="btn btn-primary" href="index.html">بازگشت به گالری</a>
        <a class="btn btn-secondary" href="https://ble.ir/peransgoldgallery" target="_blank">کانال بله</a>
      </div>

      <div class="status" id="status">در حال دریافت اطلاعات قیمت...</div>
    </section>
  </div>

 <script>
  async function fetchGoldPrice() {
    const gold18 = document.getElementById('gold18');
    const updatedAt = document.getElementById('updatedAt');
    const unit = document.getElementById('unit');
    const status = document.getElementById('status');

    try {
      const response = await fetch('https://eojmejm8zxddf8l.m.pipedream.net', {
        method: 'GET',
        cache: 'no-store'
      });

      const rawText = await response.text();

      if (!response.ok) {
        throw new Error(rawText || 'request failed');
      }

      const data = JSON.parse(rawText);

      if (!data.price) {
        throw new Error('price not found');
      }

      gold18.textContent = Number(data.price).toLocaleString('fa-IR') + ' تومان';
      unit.textContent = data.unit || 'تومان';
      updatedAt.textContent = data.updated_at || new Date().toLocaleTimeString('fa-IR');
      status.textContent = 'اطلاعات با موفقیت دریافت شد.';
    } catch (error) {
      gold18.textContent = 'خطا در دریافت قیمت';
      unit.textContent = '---';
      updatedAt.textContent = '---';
      status.textContent = 'قیمت فعلاً قابل دریافت نیست.';
      console.log('Gold price error:', error);
    }
  }

  fetchGoldPrice();
  setInterval(fetchGoldPrice, 600000);
</script>

</body>
</html>
