<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>پنل مدیریت</title>
    <style>
        body { background: #0b0b0d; color: #fff; padding: 20px; font-family: sans-serif; }
        textarea { width: 100%; height: 300px; background: #1a1a1a; color: #0f0; padding: 10px; }
    </style>
</head>
<body>
    <h1>ویرایشگر محصولات (JSON)</h1>
    <textarea id="json-input"></textarea><br>
    <button onclick="save()">ذخیره (دانلود فایل)</button>
    <script>
        fetch('../products.json').then(r => r.json()).then(d => document.getElementById('json-input').value = JSON.stringify(d, null, 2));
        function save() {
            const data = document.getElementById('json-input').value;
            const blob = new Blob([data], {type: 'application/json'});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'products.json';
            a.click();
        }
    </script>
</body>
</html>
