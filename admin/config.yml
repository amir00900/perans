backend:
  name: github
  repo: amir00900/perans
  branch: main
  auth_type: implicit
  app_id: 0v23lid8pQVy13mbckPP

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "settings"
    label: "تنظیمات سایت"
    files:
      - file: "content/site.json"
        label: "اطلاعات پایه"
        name: "site_info"
        fields:
          - {label: "نام برند", name: "brandName", widget: "string"}
          - {label: "تیتر اصلی", name: "heroTitle", widget: "string"}
          - {label: "زیر تیتر", name: "heroSubtitle", widget: "text"}
  
  - name: "products_collection"
    label: "لیست محصولات"
    files:
      - file: "content/products.json"
        label: "ویرایش محصولات"
        name: "products_file"
        fields:
          - name: "items"
            label: "محصولات"
            widget: "list"
            fields:
              - {label: "عنوان", name: "title", widget: "string"}
              - {label: "قیمت", name: "price", widget: "string"}
              - {label: "تصویر", name: "image", widget: "image"}
