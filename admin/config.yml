backend:
  name: github
  repo: amir00900/perans
  branch: main
  auth_type: implicit
  app_id: Ov23lirxAF8ICEMitDZd

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "products"
    label: "محصولات"
    folder: "content/products"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "نام محصول", name: "title", widget: "string" }
      - { label: "قیمت (تومان)", name: "price", widget: "number" }
      - { label: "وزن (گرم)", name: "weight", widget: "number" }
      - { label: "تصویر محصول", name: "image", widget: "image" }
      - { label: "توضیحات", name: "body", widget: "markdown" }

  - name: "settings"
    label: "تنظیمات سایت"
    files:
      - file: "content/settings.json"
        label: "اطلاعات تماس و برند"
        name: "general"
        fields:
          - { label: "نام گالری", name: "siteTitle", widget: "string" }
          - { label: "شماره تماس", name: "phone", widget: "string" }
          - { label: "آدرس اینستاگرام", name: "instagram", widget: "string" }
