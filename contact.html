<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ارتباط با‌ما | پرنس گلد</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: 'Tahoma', system-ui, -apple-system, sans-serif;
      background-image: url('ax/gold-earrings-necklace-geometric-set.webp');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
   .card {
  width: 100%;
  max-width: 390px;
  background: rgba(255, 255, 255, 0.55);
  padding: 32px 24px;
  border-radius: 28px;
  text-align: center;
  backdrop-filter: blur(0 12px 30px rgba(0 blur(18px);
  box-shadow: 0 12px 30px rgba(0, 0, 0, 0.10);
  border: 1px solid rgba(255, 255, 255, 0.35);
}
    h1 {
      font-size: 1.45rem;
      color: #222;
      margin: 0 0 24px 0;
      font-weight: 700;
    }
    .btn-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      width: 100%;
      padding: 13px 20px;
      background: #ffffff;
      border: 1px solid #e9e9e9;
      border-radius: 16px;
      text-decoration: none;
      color: #2c3e50;
      font-weight: 600;
      font-size: 1rem;
      transition: all 0.25s ease;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.03);
    }
    .btn:hover {
      background: #f8f9fa;
      transform: translateY(-2px);
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.07);
      border-color: #ddd;
    }
    .btn img {
      position: absolute;
      right: 14px;
      width: 32px;
      height: 32px;
      object-fit: contain;
      border-radius: 8px;
    }
    .btn span {
      margin: 0 auto;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>ارتباط باما</h1>
    <div class="btn-list">
      <a class="btn" href="https://t.me/peransgoldgallery" target="_blank" rel="noopener noreferrer">
        <img src="ax/icon/telegram.png" alt="تلگرام" />
        <span>تلگرام</span>
      </a>
      <a class="btn" href="https://ble.ir/peransgoldgallery" target="_blank" rel="noopener noreferrer">
        <img src="ax/icon/bale.png" alt="بله" />
        <span>بله</span>
      </a>
      <a class="btn" href="https://rubika.ir/peransgoldgalery" target="_blank" rel="noopener noreferrer">
        <img src="ax/icon/rubika.png" alt="روبیکا" />
        <span>روبیکا</span>
      </a>
      <a class="btn" href="https://instagram.com/peransgoldgallery" target="_blank" rel="noopener noreferrer">
        <img src="ax/icon/instagram.png" alt="اینستاگرام" />
        <span>اینستاگرام</span>
      </a>
      <a class="btn" href="https://wa.me/989374487349" target="_blank" rel="noopener noreferrer">
        <img src="ax/icon/whatsapp.png" alt="واتساپ" />
        <span>واتساپ</span>
      </a>
    </div>
  </div>
</body>
</html>
